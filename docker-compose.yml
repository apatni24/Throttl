x-limiter-env: &limiter-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/throttl
  SPRING_DATASOURCE_USERNAME: throttl
  SPRING_DATASOURCE_PASSWORD: throttl
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  THROTTL_FAIL_CLOSED: "true"
  THROTTL_CHECK_IO: ${THROTTL_CHECK_IO:-sync}
  THROTTL_REDIS_SHARE_NATIVE: ${THROTTL_REDIS_SHARE_NATIVE:-false}
  THROTTL_REDIS_POOL_ENABLED: ${THROTTL_REDIS_POOL_ENABLED:-true}
  THROTTL_REDIS_POOL_MAX_ACTIVE: ${THROTTL_REDIS_POOL_MAX_ACTIVE:-32}
  THROTTL_REDIS_CLUSTER: ${THROTTL_REDIS_CLUSTER:-false}
  THROTTL_ADMIN_TOKEN: ${THROTTL_ADMIN_TOKEN:-throttl-dev-admin-token}
  THROTTL_ENVIRONMENT: LOCAL
  THROTTL_PROMETHEUS_URL: http://prometheus:9090
  THROTTL_GRAFANA_URL: http://grafana:3000
  THROTTL_LIMITER_1_URL: http://limiter-1:8080
  THROTTL_LIMITER_2_URL: http://limiter-2:8080
  THROTTL_LIMITER_3_URL: http://limiter-3:8080
  THROTTL_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8088

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: throttl
      POSTGRES_USER: throttl
      POSTGRES_PASSWORD: throttl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throttl -d throttl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  limiter-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.rate-limiter
    environment:
      <<: *limiter-env
      THROTTL_INSTANCE_ID: limiter-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8081:8080"

  limiter-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.rate-limiter
    environment:
      <<: *limiter-env
      THROTTL_INSTANCE_ID: limiter-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8082:8080"

  limiter-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.rate-limiter
    environment:
      <<: *limiter-env
      THROTTL_INSTANCE_ID: limiter-3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8083:8080"

  rate-limiter:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - limiter-1
      - limiter-2
      - limiter-3

  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    environment:
      RATE_LIMITER_BASE_URL: http://rate-limiter:8080
      THROTTL_ADMIN_TOKEN: ${THROTTL_ADMIN_TOKEN:-throttl-dev-admin-token}
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - rate-limiter

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - limiter-1
      - limiter-2
      - limiter-3

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  throttl-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8088:80"
    depends_on:
      - rate-limiter

volumes:
  postgres-data:
