services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: throttl
      POSTGRES_USER: throttl
      POSTGRES_PASSWORD: throttl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throttl -d throttl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  limiter-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.rate-limiter
    environment: &limiter-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/throttl
      SPRING_DATASOURCE_USERNAME: throttl
      SPRING_DATASOURCE_PASSWORD: throttl
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      THROTTL_FAIL_CLOSED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8081:8080"

  limiter-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.rate-limiter
    environment: *limiter-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8082:8080"

  limiter-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.rate-limiter
    environment: *limiter-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8083:8080"

  rate-limiter:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - limiter-1
      - limiter-2
      - limiter-3

  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    environment:
      RATE_LIMITER_BASE_URL: http://rate-limiter:8080
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - rate-limiter

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - limiter-1
      - limiter-2
      - limiter-3

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
