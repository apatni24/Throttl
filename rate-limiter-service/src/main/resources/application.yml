spring:
  application:
    name: rate-limiter-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/throttl}
    username: ${SPRING_DATASOURCE_USERNAME:throttl}
    password: ${SPRING_DATASOURCE_PASSWORD:throttl}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

throttl:
  cache-ttl-seconds: ${THROTTL_CACHE_TTL_SECONDS:60}
  fail-closed: ${THROTTL_FAIL_CLOSED:true}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.throttl.ratelimiter.engine.PolicyCatalog: INFO
    com.throttl.ratelimiter.engine.RuntimeBucketStore: INFO
