spring:
  application:
    name: rate-limiter-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/throttl}
    username: ${SPRING_DATASOURCE_USERNAME:throttl}
    password: ${SPRING_DATASOURCE_PASSWORD:throttl}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        pool:
          enabled: ${THROTTL_REDIS_POOL_ENABLED:true}
          max-active: ${THROTTL_REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${THROTTL_REDIS_POOL_MAX_IDLE:32}
          min-idle: ${THROTTL_REDIS_POOL_MIN_IDLE:8}
          max-wait: ${THROTTL_REDIS_POOL_MAX_WAIT:500ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

throttl:
  cache-ttl-seconds: ${THROTTL_CACHE_TTL_SECONDS:60}
  fail-closed: ${THROTTL_FAIL_CLOSED:true}
  check-io: ${THROTTL_CHECK_IO:sync}
  redis-share-native-connection: ${THROTTL_REDIS_SHARE_NATIVE:false}
  instance-id: ${THROTTL_INSTANCE_ID:local}
  environment: ${THROTTL_ENVIRONMENT:LOCAL}
  prometheus-url: ${THROTTL_PROMETHEUS_URL:http://localhost:9090}
  grafana-url: ${THROTTL_GRAFANA_URL:http://localhost:3000}
  cors-origins: ${THROTTL_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8088}
  instances:
    - id: limiter-1
      url: ${THROTTL_LIMITER_1_URL:http://localhost:8081}
    - id: limiter-2
      url: ${THROTTL_LIMITER_2_URL:http://localhost:8082}
    - id: limiter-3
      url: ${THROTTL_LIMITER_3_URL:http://localhost:8083}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    mbeanregistry:
      enabled: true

logging:
  level:
    com.throttl.ratelimiter.engine.PolicyCatalog: INFO
    com.throttl.ratelimiter.engine.RuntimeBucketStore: INFO
