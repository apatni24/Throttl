global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: rate-limiter
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - limiter-1:8080
          - limiter-2:8080
          - limiter-3:8080
        labels:
          service: rate-limiter
