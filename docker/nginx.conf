events {
  worker_connections 4096;
}

http {
  map $http_origin $cors_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:4173" $http_origin;
    "http://127.0.0.1:4173" $http_origin;
    "http://localhost:8088" $http_origin;
    "http://127.0.0.1:8088" $http_origin;
  }

  upstream rate_limiter {
    server limiter-1:8080;
    server limiter-2:8080;
    server limiter-3:8080;
    keepalive 32;
  }

  server {
    listen 8080;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 3600 always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location / {
      proxy_pass http://rate_limiter;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Spring also emits CORS headers; browsers reject duplicate ACAO.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
    }
  }
}
